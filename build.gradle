plugins { id 'java' }

group = 'com.taskmanjournal'
version = '0.5.2'

repositories {
    maven { url = 'https://repo.runelite.net'; content { includeGroupByRegex 'net\\.runelite.*' } }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'
dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:client:${runeLiteVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.taskmanjournal.JournalLauncher'
    args '--developer-mode'
    jvmArgs '-ea'
}

tasks.register('coreCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.taskmanjournal.CoreChecks'
    jvmArgs '-ea'
}
check.dependsOn coreCheck

tasks.register('integrationCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.taskmanjournal.IntegrationChecks'
    jvmArgs '-ea', '-Djava.awt.headless=true'
}
check.dependsOn integrationCheck

tasks.register('filepathCheck', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.taskmanjournal.FilepathChecks'
    jvmArgs '-ea', '-Djava.awt.headless=true', '-Dtaskman.isolatedHome=true'
    doFirst {
        def isolatedHome = new File(temporaryDir, UUID.randomUUID().toString())
        isolatedHome.mkdirs()
        systemProperty 'user.home', isolatedHome.absolutePath
    }
}
check.dependsOn filepathCheck
